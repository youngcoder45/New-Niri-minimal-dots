# Fuzzel Configuration - Glassy Dark Theme

[main]
font=DejaVu Sans:weight=bold:size=11
dpi-aware=no
terminal=alacritty -e
prompt="❯ "
icon-theme=Papirus-Dark
width=35
horizontal-pad=20
vertical-pad=10
inner-pad=5
line-height=20
lines=8
letter-spacing=0
anchor=center
layer=overlay
exit-on-keyboard-focus-loss=yes

[colors]
background=1e1e2ee6
text=cdd6f4ff
match=89b4faff
selection=313244ff
selection-text=cdd6f4ff
selection-match=89b4faff
# border=8be9fdff

# [border]
# width=1
# radius=12

[dmenu]
mode=text  # text | index
exit-immediately-if-empty=no
