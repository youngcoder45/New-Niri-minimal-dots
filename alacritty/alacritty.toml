[general]
live_config_reload = true

[window]
decorations = "None"
padding = { x = 10, y = 10 }
opacity = 0.90

[font]
size = 9

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[scrolling]
history = 10000
multiplier = 3

[cursor]
style = { shape = "Beam", blinking = "On" }
blink_interval = 500
unfocused_hollow = true

[mouse]
hide_when_typing = true

[bell]
duration = 0

[terminal]
shell = { program = "/usr/bin/fish" }

# Colors: deep navy base with sunset-orange accents
[colors.primary]
background = "#0b1020"
foreground = "#c8d3f5"

[colors.cursor]
text = "#0b1020"
cursor = "#ffb86c"

[colors.selection]
text = "#0b1020"
background = "#cba6f7"

[colors.normal]
black = "#1b2336"
red = "#ff6e5e"
green = "#7bd88f"
yellow = "#ffb86c"
blue = "#89b4fa"
magenta = "#cba6f7"
cyan = "#74c7ec"
white = "#c8d3f5"

[colors.bright]
black = "#2a3452"
red = "#ff6e5e"
green = "#7bd88f"
yellow = "#ffd29c"
blue = "#a6bfff"
magenta = "#f5c2e7"
cyan = "#89dceb"
white = "#ffffff"
